<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Booking Laboratorium</title>
  <link rel="stylesheet" href="/lab.css">
</head>
<body>
  <main class="page" style="max-width:800px">
    <header class="topbar">
      <div class="brand"><div class="logo">L</div><div><h1>Booking Laboratorium</h1><div class="muted small">Ajukan penggunaan ruangan di luar jadwal tetap.</div></div></div>
      <nav class="nav"><a class="btn secondary" href="/schedule.html">Lihat Jadwal</a></nav>
    </header>

    <section class="card">
      <div class="card-head"><div><h2>Form Pengajuan</h2><span class="muted small">Untuk dosen dan staf · Senin–Sabtu, 08.00–16.00</span></div></div>
      <form id="bookingForm" class="card-body">
        <div class="form-grid">
          <div class="field"><label for="room_id">Ruangan</label><select id="room_id" required><option value="">Memuat ruangan…</option></select></div>
          <div class="field"><label for="booking_date">Tanggal</label><input id="booking_date" type="date" required></div>
          <div class="field"><label for="start_time">Jam mulai</label><input id="start_time" type="time" min="08:00" max="16:00" required></div>
          <div class="field"><label for="end_time">Jam selesai</label><input id="end_time" type="time" min="08:00" max="16:00" required></div>
          <div class="field"><label for="borrower_name">Nama peminjam</label><input id="borrower_name" maxlength="120" autocomplete="name" placeholder="Nama lengkap" required></div>
          <div class="field"><label for="borrower_role">Peran</label><select id="borrower_role" required><option value="Dosen">Dosen</option><option value="Staff">Staf</option></select></div>
          <div class="field full"><label for="borrower_contact">Kontak aktif</label><input id="borrower_contact" maxlength="120" placeholder="Nomor WhatsApp atau email" required></div>
          <div class="field full"><label for="purpose">Keperluan</label><textarea id="purpose" maxlength="500" placeholder="Contoh: ujian, praktikum tambahan, pelatihan, atau workshop" required></textarea></div>
        </div>
        <div class="notice section-space">Sistem otomatis menolak jadwal yang bentrok. Pengajuan baru tampil di jadwal publik setelah disetujui admin.</div>
        <div id="message" class="status-message" role="alert"></div>
        <div class="actions section-space"><button id="submitButton" class="btn" type="submit">Kirim Pengajuan</button><a class="btn secondary" href="/schedule.html">Batal</a></div>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById("bookingForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const today = new Date(Date.now() + 7 * 60 * 60 * 1000).toISOString().slice(0, 10);
    booking_date.min = today;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `status-message show ${type}`;
    }

    fetch("/.netlify/functions/get-rooms")
      .then(response => response.json())
      .then(result => {
        if (result.status !== "success" || !result.data.length) throw new Error();
        room_id.innerHTML = `<option value="">Pilih ruangan</option>` + result.data.map(room =>
          `<option value="${Number(room.id)}">${String(room.room_name).replace(/[&<>"]/g, "")}</option>`
        ).join("");
      })
      .catch(() => {
        room_id.innerHTML = `<option value="1">Lab C.413</option><option value="2">Lab C.405</option>`;
      });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.className = "status-message";
      if (start_time.value >= end_time.value) return showMessage("Jam selesai harus setelah jam mulai.", "error");
      if (new Date(booking_date.value + "T00:00:00").getDay() === 0) return showMessage("Lab tidak dapat dibooking pada hari Minggu.", "error");

      const payload = {
        room_id: Number(room_id.value), booking_date: booking_date.value,
        start_time: start_time.value, end_time: end_time.value,
        borrower_name: borrower_name.value.trim(), borrower_role: borrower_role.value,
        borrower_contact: borrower_contact.value.trim(), purpose: purpose.value.trim()
      };

      submitButton.disabled = true;
      submitButton.textContent = "Mengirim…";
      try {
        const response = await fetch("/.netlify/functions/create-booking", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok || result.status !== "success") throw new Error(result.message || "Pengajuan gagal");
        form.reset();
        booking_date.min = today;
        showMessage(result.message, "success");
      } catch (error) {
        showMessage(error.message || "Tidak dapat terhubung ke server.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Kirim Pengajuan";
      }
    });
  </script>
</body>
</html>
