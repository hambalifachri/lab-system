<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Software Laboratorium</title><link rel="stylesheet" href="/lab.css"></head><body><main class="page"><header class="topbar"><div class="brand"><div class="logo">L</div><div><h1>Software Laboratorium</h1><div class="muted small">Daftar aplikasi, lisensi, dan ketersediaan ruang laboratorium.</div></div></div><nav class="nav"><a class="btn" href="/booking.html">Booking Lab</a><a class="btn secondary" href="/schedule.html">Jadwal</a><a class="btn secondary" href="/admin-software.html">Kelola Software</a></nav></header><section class="card"><div id="notice" class="empty">Memuat katalog software…</div><div class="table-wrap"><table><thead><tr><th>Software</th><th>Versi</th><th>Lisensi</th><th>Status Lisensi</th><th>Tersedia di</th><th>Keterangan</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const esc=v=>String(v??'-').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}):'-';fetch('/.netlify/functions/software-catalog',{cache:'no-store'}).then(r=>r.json()).then(x=>{if(x.setup_required){notice.textContent='Katalog belum diaktifkan oleh admin.';return}const data=x.data||[];notice.style.display='none';rows.innerHTML=data.length?data.map(s=>`<tr><td><strong>${esc(s.software_name)}</strong></td><td>${esc(s.version)}</td><td>${esc(s.license_type)}</td><td>${s.license_status==='lifetime'?'<span class="badge approved">Lifetime</span>':`<span class="badge">Berakhir ${fmt(s.expires_on)}</span>`}</td><td>${esc(s.lab_rooms?.room_name||'Semua laboratorium')}</td><td>${esc(s.notes)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada software yang dicatat.</td></tr>'}).catch(()=>notice.textContent='Katalog belum dapat dimuat.');</script></body></html>
