<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atur Periode Semester</title><link rel="stylesheet" href="/lab.css"></head>
<body><main class="page"><header class="topbar"><div class="brand"><div class="logo">A</div><div><h1>Atur Periode Semester</h1><div class="muted small">Berlaku untuk pengajuan jadwal tetap publik.</div></div></div><nav class="nav"><a class="btn secondary" href="/admin-schedule.html">Jadwal Semester</a><a class="btn secondary" href="/admin.html">PC Lab</a></nav></header>
<article class="card"><div class="card-body"><p class="muted">Atur bulan dan tanggal. Tahun pada isian hanya penanda; sistem memakai tahun akademik yang dipilih pemohon.</p><form id="form" class="form-grid"><div class="field full"><h2>Semester Gasal</h2></div><div class="field"><label>Mulai</label><input id="gasal_start" type="date" required></div><div class="field"><label>Selesai</label><input id="gasal_end" type="date" required></div><div class="field full"><h2>Semester Genap</h2></div><div class="field"><label>Mulai</label><input id="genap_start" type="date" required></div><div class="field"><label>Selesai</label><input id="genap_end" type="date" required></div><div id="message" class="status-message"></div><div class="actions section-space"><button class="btn" type="submit">Simpan Periode</button></div></form></div></article></main>
<script>
let token=localStorage.getItem("admin_token")||"";if(!token){token=prompt("Masukkan password admin:")||"";if(token)localStorage.setItem("admin_token",token);}const y=2000,dt=(m,d)=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;async function api(action,periods){const r=await fetch("/.netlify/functions/admin-schedules",{method:"POST",headers:{"x-admin-token":token,"Content-Type":"application/json"},body:JSON.stringify({action,periods})}),j=await r.json();if(!r.ok||j.status!=="success")throw new Error(j.message||"Permintaan gagal");return j;}function show(t,type){message.textContent=t;message.className=`status-message show ${type}`;}api("get_period_settings").then(r=>r.data.forEach(p=>{document.getElementById(`${p.period_type}_start`).value=dt(p.start_month,p.start_day);document.getElementById(`${p.period_type}_end`).value=dt(p.end_month,p.end_day);})).catch(e=>show(e.message,"error"));form.addEventListener("submit",async e=>{e.preventDefault();const make=t=>{const a=document.getElementById(`${t}_start`).value.split("-").map(Number),b=document.getElementById(`${t}_end`).value.split("-").map(Number);return{period_type:t,start_month:a[1],start_day:a[2],end_month:b[1],end_day:b[2]};};try{show((await api("save_period_settings",[make("gasal"),make("genap")])).message,"success");}catch(e){show(e.message,"error");}});
</script></body></html>
