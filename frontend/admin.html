<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 28px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin-top: 6px;
      color: #94a3b8;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .refresh,
    .logout-admin {
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .refresh {
      background: #2563eb;
    }

    .logout-admin {
      background: #dc2626;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #1e293b;
      border-radius: 12px;
      background: #111827;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid #1e293b;
      font-size: 14px;
    }

    th {
      background: #020617;
      color: #cbd5e1;
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .dipakai {
      background: rgba(37, 99, 235, 0.2);
      color: #93c5fd;
    }

    .kosong {
      background: rgba(22, 163, 74, 0.2);
      color: #86efac;
    }

    .offline {
      background: rgba(220, 38, 38, 0.2);
      color: #fca5a5;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: #94a3b8;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div>
      <h1>Dashboard Lab Komputer</h1>
      <div class="subtitle">Monitoring penggunaan PC lab secara realtime.</div>
    </div>

    <div class="actions">
      <button class="refresh" onclick="loadStatus()">Refresh</button>
      <button class="logout-admin" onclick="logoutAdmin()">Keluar Admin</button>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>PC</th>
          <th>Status</th>
          <th>NIM</th>
          <th>Nama</th>
          <th>Ruangan</th>
          <th>Login</th>
          <th>Last Seen</th>
        </tr>
      </thead>

      <tbody id="statusBody">
        <tr>
          <td colspan="7" class="empty">Memuat data...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    let adminToken = localStorage.getItem("admin_token");

    if (!adminToken) {
      adminToken = prompt("Masukkan password admin:");

      if (adminToken) {
        localStorage.setItem("admin_token", adminToken);
      }
    }

    function logoutAdmin() {
      localStorage.removeItem("admin_token");
      location.reload();
    }

    function handleUnauthorized(result) {
      if (result.status === "error" && result.message === "Akses admin ditolak") {
        localStorage.removeItem("admin_token");
        alert("Password admin salah");
        location.reload();
        return true;
      }

      return false;
    }

    function formatDate(value) {
      if (!value) return "-";

      const date = new Date(value);

      return date.toLocaleString("id-ID", {
        timeZone: "Asia/Jakarta",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function formatAgo(seconds) {
      if (seconds === null || seconds === undefined) return "-";

      if (seconds < 60) {
        return seconds + " detik lalu";
      }

      const minutes = Math.floor(seconds / 60);

      if (minutes < 60) {
        return minutes + " menit lalu";
      }

      const hours = Math.floor(minutes / 60);
      return hours + " jam lalu";
    }

    function loadStatus() {
      const tbody = document.getElementById("statusBody");

      if (!adminToken) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="empty">Akses admin diperlukan</td>
          </tr>
        `;
        return;
      }

      fetch('/.netlify/functions/admin-status', {
        cache: 'no-store',
        headers: {
          'x-admin-token': adminToken
        }
      })
      .then(res => res.json())
      .then(result => {
        if (handleUnauthorized(result)) return;

        if (result.status !== "success") {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" class="empty">Gagal mengambil data</td>
            </tr>
          `;
          return;
        }

        const rows = result.data;

        if (!rows || rows.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" class="empty">Belum ada PC terdaftar</td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = rows.map(row => `
          <tr>
            <td>${row.computer_name || "-"}</td>
            <td><span class="badge ${row.status}">${row.status}</span></td>
            <td>${row.nim || "-"}</td>
            <td>${row.nama || "-"}</td>
            <td>${row.room || "-"}</td>
            <td>${formatDate(row.login_at)}</td>
            <td>${formatAgo(row.seconds_ago)}</td>
          </tr>
        `).join("");
      })
      .catch(() => {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="empty">Gagal koneksi ke server</td>
          </tr>
        `;
      });
    }

    loadStatus();
    setInterval(loadStatus, 300000);
  </script>

</body>
</html>
