<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Booking Lab</title>
  <link rel="stylesheet" href="/lab.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><div class="logo">A</div><div><h1>Kelola Booking Lab</h1><div class="muted small">Periksa dan putuskan pengajuan peminjaman.</div></div></div>
      <nav class="nav"><a class="btn secondary" href="/admin.html">PC Lab</a><a class="btn secondary" href="/admin-schedule.html">Jadwal Tetap</a><a class="btn" href="/schedule.html">Jadwal Publik</a><button class="btn danger" onclick="logoutAdmin()">Keluar</button></nav>
    </header>

    <section class="stats">
      <div class="stat"><span class="muted small">Menunggu</span><strong id="pendingCount">0</strong></div>
      <div class="stat"><span class="muted small">Disetujui</span><strong id="approvedCount">0</strong></div>
      <div class="stat"><span class="muted small">Ditolak</span><strong id="rejectedCount">0</strong></div>
      <div class="stat"><span class="muted small">Total</span><strong id="totalCount">0</strong></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div><h2>Daftar Pengajuan</h2><span class="muted small">Pengajuan terbaru ditampilkan lebih dahulu.</span></div>
        <div class="filters"><select id="statusFilter" class="filter-control"><option value="">Semua status</option><option value="pending">Menunggu</option><option value="approved">Disetujui</option><option value="rejected">Ditolak</option><option value="cancelled">Dibatalkan</option></select><input id="searchInput" class="filter-control" placeholder="Cari nama/lab…"><button class="btn secondary" onclick="loadBookings()">Refresh</button></div>
      </div>
      <div id="message" class="status-message" style="margin:14px 18px 0"></div>
      <div id="bookingList" class="empty">Memuat pengajuan…</div>
    </section>
  </main>

  <script>
    let token = localStorage.getItem("admin_token") || "";
    let rows = [];
    const esc = value => String(value ?? "-").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const time = value => value ? value.slice(0, 5) : "-";
    const date = value => value ? new Date(value + "T00:00:00").toLocaleDateString("id-ID", { weekday:"short", day:"2-digit", month:"short", year:"numeric" }) : "-";
    const labels = { pending:"Menunggu", approved:"Disetujui", rejected:"Ditolak", cancelled:"Dibatalkan" };
    if (!token) { token = prompt("Masukkan password admin:") || ""; if (token) localStorage.setItem("admin_token", token); }

    function logoutAdmin() { localStorage.removeItem("admin_token"); location.href = "/admin.html"; }
    function showMessage(text, type) { message.textContent = text; message.className = `status-message show ${type}`; }
    async function api(path, options = {}) {
      options.headers = { ...(options.headers || {}), "x-admin-token": token };
      const response = await fetch(path, options); const result = await response.json();
      if (response.status === 401) { localStorage.removeItem("admin_token"); throw new Error("Password admin salah. Muat ulang halaman."); }
      if (!response.ok || result.status !== "success") throw new Error(result.message || "Permintaan gagal");
      return result;
    }

    function updateStats() {
      pendingCount.textContent = rows.filter(row => row.status === "pending").length;
      approvedCount.textContent = rows.filter(row => row.status === "approved").length;
      rejectedCount.textContent = rows.filter(row => row.status === "rejected").length;
      totalCount.textContent = rows.length;
    }

    function renderActions(row) {
      if (row.status === "pending") return `<div class="actions"><button class="btn success small-btn" onclick="updateStatus(${row.id},'approved')">Setujui</button><button class="btn danger small-btn" onclick="updateStatus(${row.id},'rejected')">Tolak</button></div>`;
      if (row.status === "approved") return `<button class="btn warning small-btn" onclick="updateStatus(${row.id},'cancelled')">Batalkan</button>`;
      return "—";
    }

    function renderRows() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = rows.filter(row => (!statusFilter.value || row.status === statusFilter.value) && (!query || [row.borrower_name,row.room_name,row.purpose,row.borrower_contact].some(value => String(value || "").toLowerCase().includes(query))));
      if (!filtered.length) { bookingList.innerHTML = `<div class="empty">Tidak ada pengajuan yang sesuai.</div>`; return; }
      bookingList.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Tanggal/Waktu</th><th>Ruangan</th><th>Peminjam</th><th>Keperluan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${filtered.map(row => `
        <tr><td><strong>${date(row.booking_date)}</strong><br><span class="time small">${time(row.start_time)}–${time(row.end_time)}</span></td><td><span class="badge">${esc(row.room_name)}</span></td><td><strong>${esc(row.borrower_name)}</strong> · ${esc(row.borrower_role)}<br><span class="muted small">${esc(row.borrower_contact)}</span></td><td>${esc(row.purpose)}${row.admin_note ? `<br><span class="muted small">Catatan: ${esc(row.admin_note)}</span>` : ""}</td><td><span class="badge ${esc(row.status)}">${labels[row.status] || esc(row.status)}</span></td><td>${renderActions(row)}</td></tr>`).join("")}</tbody></table></div>`;
    }

    async function updateStatus(id, status) {
      let note = "";
      if (status === "rejected" || status === "cancelled") { note = prompt(status === "rejected" ? "Alasan penolakan:" : "Alasan pembatalan:", "") || ""; if (!note.trim()) return; }
      try {
        const result = await api("/.netlify/functions/update-booking-status", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ id, status, admin_note:note.trim() }) });
        showMessage(result.message, "success"); await loadBookings();
      } catch (error) { showMessage(error.message, "error"); }
    }

    async function loadBookings() {
      bookingList.innerHTML = `<div class="empty">Memuat pengajuan…</div>`;
      try { const result = await api("/.netlify/functions/admin-bookings"); rows = result.data || []; updateStats(); renderRows(); }
      catch (error) { bookingList.innerHTML = `<div class="empty">${esc(error.message)}</div>`; }
    }
    statusFilter.addEventListener("change", renderRows); searchInput.addEventListener("input", renderRows); loadBookings();
  </script>
</body>
</html>
