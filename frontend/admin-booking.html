<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Booking Lab</title><link rel="stylesheet" href="/lab.css"></head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><div class="logo">A</div><div><h1>Kelola Booking Lab</h1><div class="muted small">Periksa pengajuan, peserta, dan persetujuan aturan.</div></div></div>
      <nav class="nav"><a class="btn secondary" href="/admin.html">PC Lab</a><a class="btn secondary" href="/admin-schedule.html">Jadwal Tetap</a><a class="btn" href="/schedule.html">Jadwal Publik</a><button class="btn danger" onclick="logoutAdmin()">Keluar</button></nav>
    </header>
    <section class="stats">
      <div class="stat"><span class="muted small">Menunggu</span><strong id="pendingCount">0</strong></div><div class="stat"><span class="muted small">Disetujui</span><strong id="approvedCount">0</strong></div><div class="stat"><span class="muted small">Ditolak</span><strong id="rejectedCount">0</strong></div><div class="stat"><span class="muted small">Total</span><strong id="totalCount">0</strong></div>
    </section>
    <section class="card">
      <div class="card-head"><div><h2>Daftar Pengajuan</h2><span class="muted small">Pengajuan terbaru ditampilkan lebih dahulu.</span></div><div class="filters"><select id="statusFilter" class="filter-control"><option value="">Semua status</option><option value="pending">Menunggu</option><option value="approved">Disetujui</option><option value="rejected">Ditolak</option><option value="cancelled">Dibatalkan</option></select><input id="searchInput" class="filter-control" placeholder="Cari nama, kode, atau lab"><button class="btn secondary" onclick="exportBookings()">Export CSV</button><button class="btn secondary" onclick="loadBookings()">Refresh</button></div></div>
      <div id="message" class="status-message" style="margin:14px 18px 0"></div><div id="bookingList" class="empty">Memuat pengajuan...</div>
    </section>
  </main>
  <script>
    let token = localStorage.getItem("admin_token") || "", rows = [];
    const esc = value => String(value ?? "-").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const time = value => value ? value.slice(0,5) : "-";
    const date = value => value ? new Date(value + "T00:00:00").toLocaleDateString("id-ID", { weekday:"short", day:"2-digit", month:"short", year:"numeric" }) : "-";
    const labels = { pending:"Menunggu", approved:"Disetujui", rejected:"Ditolak", cancelled:"Dibatalkan" };
    if (!token) { token = prompt("Masukkan password admin:") || ""; if (token) localStorage.setItem("admin_token", token); }
    function logoutAdmin() { localStorage.removeItem("admin_token"); location.href = "/admin.html"; }
    function showMessage(text,type) { message.textContent=text; message.className=`status-message show ${type}`; }
    async function api(path,options={}) { options.headers={...(options.headers||{}),"x-admin-token":token}; const response=await fetch(path,options), result=await response.json(); if(response.status===401){localStorage.removeItem("admin_token");throw new Error("Password admin salah. Muat ulang halaman.");} if(!response.ok||result.status!=="success")throw new Error(result.message||"Permintaan gagal"); return result; }
    function updateStats(){ pendingCount.textContent=rows.filter(r=>r.status==="pending").length; approvedCount.textContent=rows.filter(r=>r.status==="approved").length; rejectedCount.textContent=rows.filter(r=>r.status==="rejected").length; totalCount.textContent=rows.length; }
    function filteredRows(){ const query=searchInput.value.trim().toLowerCase(); return rows.filter(row=>(!statusFilter.value||row.status===statusFilter.value)&&(!query||[row.booking_code,row.borrower_name,row.room_name,row.purpose,row.borrower_contact,row.class_name].some(value=>String(value||"").toLowerCase().includes(query)))); }
    function renderActions(row){ const nimButton=(row.participant_nims||[]).length?`<button class="btn secondary small-btn" onclick="exportNims(${row.id})">NIM (${row.participant_nims.length})</button>`:""; if(row.status==="pending")return `<div class="actions"><button class="btn success small-btn" onclick="updateStatus(${row.id},'approved')">Setujui</button><button class="btn danger small-btn" onclick="updateStatus(${row.id},'rejected')">Tolak</button>${nimButton}</div>`; if(row.status==="approved")return `<div class="actions"><button class="btn warning small-btn" onclick="updateStatus(${row.id},'cancelled')">Batalkan</button>${nimButton}</div>`; return nimButton||"-"; }
    function renderRows(){ const filtered=filteredRows(); if(!filtered.length){bookingList.innerHTML=`<div class="empty">Tidak ada pengajuan yang sesuai.</div>`;return;} bookingList.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Tanggal/Waktu</th><th>Ruangan</th><th>Penanggung Jawab</th><th>Kegiatan/Peserta</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${filtered.map(row=>`<tr><td><strong>${date(row.booking_date)}</strong><br><span class="time small">${time(row.start_time)}-${time(row.end_time)}</span><br><span class="muted small">${esc(row.booking_code)}</span></td><td><span class="badge">${esc(row.room_name)}</span></td><td><strong>${esc(row.borrower_name)}</strong> - ${esc(row.borrower_role)}<br><span class="muted small">${esc(row.borrower_contact)}</span></td><td><strong>${esc(row.class_name)}</strong> (${Number(row.participant_count||0)} orang)<br>${esc(row.purpose)}${row.admin_note?`<br><span class="muted small">Catatan: ${esc(row.admin_note)}</span>`:""}</td><td><span class="badge ${esc(row.status)}">${labels[row.status]||esc(row.status)}</span><br><span class="muted small">${row.rules_accepted_at?"Aturan disetujui":"Aturan belum disetujui"}</span></td><td>${renderActions(row)}</td></tr>`).join("")}</tbody></table></div>`; }
    function csvCell(value){ const text=Array.isArray(value)?value.join(" "):String(value??""); return `"${text.replaceAll('"','""')}"`; }
    function downloadCsv(filename,lines){ const link=document.createElement("a"); link.href=URL.createObjectURL(new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"})); link.download=filename; link.click(); URL.revokeObjectURL(link.href); }
    function exportBookings(){ const headers=["Kode","Tanggal","Mulai","Selesai","Ruangan","Status","Penanggung Jawab","Peran","Kontak","Kelas/Prodi","Jumlah Peserta","NIM Peserta","Keperluan","Catatan Admin","Aturan Disetujui"]; const data=filteredRows().map(r=>[r.booking_code,r.booking_date,time(r.start_time),time(r.end_time),r.room_name,labels[r.status]||r.status,r.borrower_name,r.borrower_role,r.borrower_contact,r.class_name,r.participant_count,r.participant_nims||[],r.purpose,r.admin_note,r.rules_accepted_at?"Ya":"Belum"].map(csvCell).join(",")); downloadCsv(`booking-lab-${new Date().toISOString().slice(0,10)}.csv`,[headers.map(csvCell).join(","),...data]); }
    function exportNims(id){ const row=rows.find(item=>item.id===id); if(!row)return; downloadCsv(`nim-${row.booking_code}.csv`,["nim",...(row.participant_nims||[])]); }
    async function updateStatus(id,status){ let note=""; if(status==="rejected"||status==="cancelled"){note=prompt(status==="rejected"?"Alasan penolakan:":"Alasan pembatalan:","")||"";if(!note.trim())return;} try{const result=await api("/.netlify/functions/update-booking-status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,status,admin_note:note.trim()})});showMessage(result.message,"success");await loadBookings();}catch(error){showMessage(error.message,"error");} }
    async function loadBookings(){ bookingList.innerHTML=`<div class="empty">Memuat pengajuan...</div>`; try{const result=await api("/.netlify/functions/admin-bookings");rows=result.data||[];updateStats();renderRows();}catch(error){bookingList.innerHTML=`<div class="empty">${esc(error.message)}</div>`;} }
    statusFilter.addEventListener("change",renderRows); searchInput.addEventListener("input",renderRows); loadBookings();
  </script>
</body>
</html>
