<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Software Lab</title><link rel="stylesheet" href="/lab.css"></head><body><main class="page"><header class="topbar"><div class="brand"><div class="logo">L</div><div><h1>Kelola Software Lab</h1><div class="muted small">Tambahkan lisensi software setiap laboratorium.</div></div></div><nav class="nav"><a class="btn secondary" href="/software.html">Lihat Katalog</a><a class="btn secondary" href="/admin.html">Dashboard</a></nav></header><section class="card"><form id="softwareForm" class="form-grid"><input type="hidden" id="softwareId"><label>Nama software *<input id="softwareName" required></label><label>Versi<input id="softwareVersion" placeholder="Contoh: 2025"></label><label>Jenis lisensi *<input id="softwareLicense" required placeholder="Contoh: Educational, Commercial"></label><label>Laboratorium<select id="softwareRoom"><option value="">Semua laboratorium</option></select></label><label>Status lisensi<select id="softwareStatus"><option value="lifetime">Lifetime</option><option value="expires">Memiliki tanggal kedaluwarsa</option></select></label><label id="expiryWrap" hidden>Tanggal kedaluwarsa<input id="softwareExpiry" type="date"></label><label style="grid-column:1/-1">Keterangan<textarea id="softwareNotes" placeholder="Contoh: Digunakan untuk praktikum struktur"></textarea></label><button class="btn" type="submit">Simpan Software</button></form><p id="msg" class="muted"></p></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Software</th><th>Lisensi</th><th>Ruang</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>let token=localStorage.getItem('admin_token')||prompt('Masukkan password admin:')||'';if(token)localStorage.setItem('admin_token',token);let items=[];const q=id=>document.getElementById(id),esc=v=>String(v??'-').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const els={form:q('softwareForm'),id:q('softwareId'),name:q('softwareName'),version:q('softwareVersion'),license:q('softwareLicense'),room:q('softwareRoom'),status:q('softwareStatus'),expiry:q('softwareExpiry'),notes:q('softwareNotes'),msg:q('msg'),rows:q('rows'),expiryWrap:q('expiryWrap')};async function api(body){const r=await fetch('/.netlify/functions/software-catalog',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':token},body:JSON.stringify(body)}),j=await r.json();if(!r.ok||j.status!=='success')throw Error(j.message);return j}async function load(){const [catalog,rooms]=await Promise.all([fetch('/.netlify/functions/software-catalog').then(r=>r.json()),fetch('/.netlify/functions/get-rooms').then(r=>r.json())]);items=catalog.data||[];els.room.innerHTML='<option value="">Semua laboratorium</option>'+(rooms.data||[]).map(x=>`<option value="${x.id}">${esc(x.room_name)}</option>`).join('');els.rows.innerHTML=items.length?items.map(x=>`<tr><td>${esc(x.software_name)} ${esc(x.version||'')}</td><td>${esc(x.license_type)}</td><td>${esc(x.lab_rooms?.room_name||'Semua')}</td><td>${x.license_status==='lifetime'?'Lifetime':esc(x.expires_on)}</td><td><button class="btn secondary" onclick="edit(${x.id})">Ubah</button> <button class="btn danger" onclick="del(${x.id})">Hapus</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Belum ada data.</td></tr>'}function edit(i){const x=items.find(a=>a.id===i);els.id.value=x.id;els.name.value=x.software_name;els.version.value=x.version||'';els.license.value=x.license_type;els.status.value=x.license_status;els.expiry.value=x.expires_on||'';els.room.value=x.room_id||'';els.notes.value=x.notes||'';toggle()}async function del(i){if(confirm('Hapus software ini?')){try{els.msg.textContent=(await api({action:'delete',id:i})).message;load()}catch(e){els.msg.textContent=e.message}}}function toggle(){els.expiryWrap.hidden=els.status.value!=='expires'}els.status.onchange=toggle;els.form.onsubmit=async e=>{e.preventDefault();try{els.msg.textContent=(await api({item:{id:els.id.value,software_name:els.name.value,version:els.version.value,license_type:els.license.value,license_status:els.status.value,expires_on:els.expiry.value,room_id:els.room.value,notes:els.notes.value}})).message;els.form.reset();els.id.value='';toggle();load()}catch(e){els.msg.textContent=e.message}};load();</script></body></html>
