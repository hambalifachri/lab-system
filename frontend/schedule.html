<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jadwal Laboratorium</title>
  <link rel="stylesheet" href="/lab.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="logo">L</div>
        <div><h1>Jadwal Laboratorium</h1><div class="muted small">Overview jadwal tetap dan booking yang aktif.</div></div>
      </div>
      <nav class="nav">
        <a class="btn" href="/booking.html">Ajukan Booking</a>
        <a class="btn secondary" href="/booking-status.html">Cek Status</a>
        <button class="btn secondary" type="button" onclick="exportSchedule()">Export CSV</button>
        <button class="btn secondary" type="button" onclick="window.print()">Cetak / PDF</button>
        <a class="btn secondary" href="/admin-booking.html">Admin</a>
      </nav>
    </header>

    <section class="stats">
      <div class="stat"><span class="muted small">Jadwal tetap</span><strong id="scheduleCount">—</strong></div>
      <div class="stat"><span class="muted small">Booking disetujui</span><strong id="bookingCount">—</strong></div>
      <div class="stat"><span class="muted small">Ruangan</span><strong id="roomCount">—</strong></div>
      <div class="stat"><span class="muted small">Hari dipilih</span><strong id="selectedLabel">—</strong></div>
    </section>

    <div class="tabs" id="tabs" aria-label="Pilih hari"></div>

    <section class="grid-2">
      <article class="card">
        <div class="card-head"><div><h2>Jadwal Tetap</h2><span class="muted small">Kuliah dan praktikum rutin</span></div></div>
        <div id="scheduleBox" class="empty">Memuat jadwal…</div>
      </article>
      <article class="card">
        <div class="card-head"><div><h2>Booking Disetujui</h2><span class="muted small">Peminjaman pada tanggal tertentu</span></div></div>
        <div id="bookingBox" class="empty">Memuat booking…</div>
      </article>
    </section>
  </main>

  <script>
    const days = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const todayIndex = new Date().getDay();
    let selectedDay = "Semua hari";
    let schedules = [], bookings = [];
    const esc = value => String(value ?? "-").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const time = value => value ? value.slice(0, 5) : "-";
    const date = value => value ? new Date(value + "T00:00:00").toLocaleDateString("id-ID", { day:"2-digit", month:"short", year:"numeric" }) : "-";

    function renderTabs() {
      const tabsList = ["Semua hari", ...days];
      tabs.innerHTML = tabsList.map(day => `<button class="tab ${day === selectedDay ? "active" : ""}" data-day="${day}">${day}</button>`).join("");
      selectedLabel.textContent = selectedDay === "Semua hari" ? "Seluruh minggu" : selectedDay;
    }

    function scheduleTable(rows) {
      if (!rows.length) return `<div class="empty">Belum ada jadwal tetap ${selectedDay === "Semua hari" ? "pada minggu ini" : `pada ${selectedDay}` }.</div>`;
      return `<div class="table-wrap"><table><thead><tr><th>Hari</th><th>Waktu</th><th>Kegiatan</th><th>Ruangan</th></tr></thead><tbody>${rows.map(row => `
        <tr><td><strong>${esc(row.day_name)}</strong></td><td class="time">${time(row.start_time)}–${time(row.end_time)}</td><td><strong>${esc(row.subject)}</strong><br><span class="muted small">${esc(row.class_name)} · ${esc(row.lecturer_name)}</span><br><span class="muted small">${esc(row.semester_label)}: ${esc(row.period_start)} s.d. ${esc(row.period_end)}</span></td><td><span class="badge">${esc(row.room_name)}</span></td></tr>`).join("")}</tbody></table></div>`;
    }

    function bookingTable(rows) {
      if (!rows.length) return `<div class="empty">Belum ada booking disetujui ${selectedDay === "Semua hari" ? "pada minggu ini" : `pada ${selectedDay}` }.</div>`;
      return `<div class="table-wrap"><table><thead><tr><th>Hari</th><th>Tanggal/Waktu</th><th>Peminjam</th><th>Ruangan</th></tr></thead><tbody>${rows.map(row => `
        <tr><td><strong>${esc(row.day_name)}</strong></td><td><strong>${date(row.booking_date)}</strong><br><span class="time small">${time(row.start_time)}–${time(row.end_time)}</span></td><td><strong>${esc(row.borrower_name)}</strong><br><span class="muted small">${esc(row.purpose)}</span></td><td><span class="badge approved">${esc(row.room_name)}</span></td></tr>`).join("")}</tbody></table></div>`;
    }

    function render() {
      renderTabs();
      const filteredSchedules = selectedDay === "Semua hari" ? schedules : schedules.filter(row => row.day_name === selectedDay);
      const filteredBookings = selectedDay === "Semua hari" ? bookings : bookings.filter(row => row.day_name === selectedDay);
      scheduleBox.innerHTML = scheduleTable(filteredSchedules);
      bookingBox.innerHTML = bookingTable(filteredBookings);
    }

    function csvCell(value) { return `"${String(value ?? "").replaceAll('"', '""')}"`; }
    function exportSchedule() {
      const header = ["Jenis","Hari","Tanggal","Mulai","Selesai","Ruangan","Kegiatan","Kelas/Peminjam","Dosen/Keperluan","Semester","Periode Mulai","Periode Selesai"];
      const fixed = schedules.map(row => ["Jadwal Tetap",row.day_name,"",time(row.start_time),time(row.end_time),row.room_name,row.subject,row.class_name,row.lecturer_name,row.semester_label,row.period_start,row.period_end]);
      const approved = bookings.map(row => ["Booking",row.day_name,row.booking_date,time(row.start_time),time(row.end_time),row.room_name,row.purpose,row.borrower_name,row.purpose,"","",""]);
      const csv = [header,...fixed,...approved].map(columns => columns.map(csvCell).join(",")).join("\r\n");
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8" }));
      link.download = `jadwal-laboratorium-${new Date().toISOString().slice(0,10)}.csv`;
      link.click(); URL.revokeObjectURL(link.href);
    }

    tabs.addEventListener("click", event => {
      const button = event.target.closest("[data-day]");
      if (!button) return;
      selectedDay = button.dataset.day;
      render();
    });

    fetch("/.netlify/functions/get-schedule", { cache: "no-store" })
      .then(async response => ({ ok: response.ok, body: await response.json() }))
      .then(({ ok, body }) => {
        if (!ok || body.status !== "success") throw new Error(body.message);
        schedules = body.schedules || [];
        bookings = body.bookings || [];
        scheduleCount.textContent = schedules.length;
        bookingCount.textContent = bookings.length;
        roomCount.textContent = new Set([...schedules, ...bookings].map(item => item.room_name)).size || "0";
        render();
      })
      .catch(() => {
        scheduleBox.innerHTML = bookingBox.innerHTML = `<div class="empty">Data belum dapat dimuat. Silakan coba lagi.</div>`;
        renderTabs();
      });
  </script>
</body>
</html>
